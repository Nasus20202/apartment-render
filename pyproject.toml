[project]
name = "apartment-render"
version = "0.1.0"
description = "Blender model and renders of flat 19, Wiszące Ogrody"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.ruff]
line-length = 100
extend-exclude = ["assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
